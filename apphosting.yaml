# Firebase App Hosting — configuración del backend de producción.
# Docs: https://firebase.google.com/docs/app-hosting/configure
# Reglas de costo: .agents/rules/cost-control.md (no cambiar minInstances sin aprobación).

runConfig:
  # 0 = sin instancias ociosas (se paga solo por uso). Costo: arranque en frío de 1–2 s.
  minInstances: 0
  # Techo ante tráfico anómalo o bots. Subir solo si las métricas lo justifican.
  maxInstances: 10
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  # Configuración web de Firebase. NO es secreta (la protegen las Security Rules y App Check).
  # Los secretos reales van con `secret:` (Secret Manager), nunca con prefijo NEXT_PUBLIC_.
  # El barrido de avisos usa PIU_NOTICES_CRON_SECRET. Crearlo en Secret Manager antes de
  # descomentar estas líneas; sin el secreto el endpoint responde 404.
  # - variable: PIU_NOTICES_CRON_SECRET
  #   secret: PIU_NOTICES_CRON_SECRET
  # Correos de reserva. Crear RESEND_API_KEY en Secret Manager después de verificar
  # piupizzas.cl. PIU_RESERVATION_EMAILS queda comentado: sin ese valor no se envía nada.
  # - variable: RESEND_API_KEY
  #   secret: RESEND_API_KEY
  #   availability:
  #     - RUNTIME
  # - variable: PIU_RESERVATION_EMAIL_FROM
  #   value: "PIÙ Pizza & Dolce <reservas@piupizzas.cl>"
  # - variable: PIU_RESERVATION_EMAILS_SINCE
  #   value: "2026-11-24T00:00:00.000Z"
  # - variable: PIU_RESERVATION_EMAILS
  #   value: "on"
  # - variable: PIU_RESERVATION_MAIL_SECRET
  #   secret: PIU_RESERVATION_MAIL_SECRET
  #   availability:
  #     - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAtlMZnZcLyvMwX7AtUaoEswEenkBJGAy4
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: piu-pizza-cl.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: piu-pizza-cl
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: piu-pizza-cl.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "864707447905"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:864707447905:web:a64297850b8873793d6e20"
  # ID de medición de Google Analytics 4 (público, como el resto de la config web). Sin este valor el sitio
  # no carga Analytics. Ver docs/arquitectura/analitica.md.
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-2XJXG2E0WJ
