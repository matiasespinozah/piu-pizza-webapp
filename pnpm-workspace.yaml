# pnpm 11 exige declarar qué dependencias pueden correr scripts de instalación.
# Si aparece una nueva en "Ignored build scripts", decidir aquí (true/false):
# un paquete sin declarar hace fallar `pnpm install` (también en Cloud Build).
allowBuilds:
  # Next.js usa los binarios precompilados de @img/sharp-*; no necesita compilar.
  sharp: false
  unrs-resolver: false
  # Usamos configuración explícita de Firebase (NEXT_PUBLIC_FIREBASE_*), no la autoconfiguración.
  "@firebase/util": false
  protobufjs: false
  re2: false

# Parches de seguridad dentro del mismo major, para dependencias transitivas que
# su paquete padre todavía no actualiza. Revisar y quitar cuando el padre lo haga.
overrides:
  # @firebase/firestore fija ~1.9 (vulnerable). En el sitio solo corre en los tests de reglas.
  "@grpc/grpc-js": "^1.14.7"
  # firebase-admin → @google-cloud/storage.
  fast-xml-parser: "^5.11.3"
