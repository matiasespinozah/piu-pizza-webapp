# Calidad de código: lint, tipos, changelog/versiones y build.
# - Push a feature/** y feat/**: valida cada rama de trabajo (changelog contra develop).
# - Push y PR a develop: valida el trabajo diario.
# - PR a main: valida de nuevo y exige que el PR venga de develop.
# Producción (main) se despliega sola con Firebase App Hosting al mergear.
# Los nombres de los jobs son los checks obligatorios de los rulesets de GitHub:
# no cambiarlos sin actualizar los rulesets. Reglas: AGENTS.md y .agents/rules/.
name: CI

on:
  push:
    branches: [develop, "feature/**", "feat/**"]
  pull_request:
    branches: [develop, main]
    # `edited` vuelve a correr los checks si se cambia la rama base del PR.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  main-guard:
    name: PR a main solo desde develop
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar rama de origen
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Solo se puede mergear a main desde develop de este repositorio (origen: $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "OK: PR desde develop."

  quality:
    name: Lint, tipos, changelog y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # necesario para comparar contra la rama base

      - name: Instalar pnpm (versión de packageManager)
        uses: pnpm/action-setup@v4

      - name: Instalar Node (versión de .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Changelog y versiones alineadas
        run: pnpm changelog:check
        env:
          # PR: exige entrada en CHANGELOG.md respecto de la rama base.
          # Push a feature/** o feat/**: respecto de develop. Push a develop: solo versiones alineadas.
          CHANGELOG_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref_name != 'develop' && 'origin/develop') || '' }}

      - name: Cache de build de Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: |
          cp .env.example .env.local
          pnpm build
